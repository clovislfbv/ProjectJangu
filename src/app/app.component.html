<div class="header">
    <div class="header-top">
        <button
            class="burger-button"
            type="button"
            aria-label="Ouvrir le menu de navigation"
            aria-controls="main-menu"
            [attr.aria-expanded]="isMenuOpen"
            (click)="toggleMenu()"
        >
            <span></span><span></span><span></span>
        </button>
        <h1>Movie browser</h1>
    </div>
    <nav id="main-menu" class="burger-menu" [class.open]="isMenuOpen" aria-label="Navigation principale">
        <button type="button" (click)="selectMediaType('movie'); movieList.showNowPlayingMovies(); closeMenu()">🎬 Films à l'affiche</button>
        <button type="button" (click)="selectMediaType('movie'); movieList.showPopularMovies(); closeMenu()">🔥 Films populaires</button>
        <button type="button" (click)="selectMediaType('movie'); movieList.showUpcomingMovies(); closeMenu()">🍿 Films à venir</button>
        <button type="button" (click)="selectMediaType('tv'); movieList.showPopularTvShows(); closeMenu()">📺 Séries populaires</button>
        <button type="button" (click)="showFeedback()">💬 Donner un avis</button>
    </nav>
    @if (activeView === 'catalog') {
        <app-search-bar
            [mediaType]="activeMediaType"
            (search)="movieList.search($event.query, $event.alphabetic, $event.year, $event.genre, $event.country)"
            (selectMovie)="movieList.onSelect($event)"
            (selectPerson)="movieList.openPerson($event)"
        ></app-search-bar>
    }
</div>
<div class="body">
    <app-movie-list #movieList [class.view-hidden]="activeView !== 'catalog'"></app-movie-list>
    @if (activeView === 'feedback') {
        <app-feedback (submitted)="handleFeedbackSubmission($event)"></app-feedback>
    }
</div>
