<div class="movie-list">
  <section *ngIf="people.length" class="people-results" aria-label="Profils d'acteurs">
    <h2>Acteurs</h2>
    <div class="people-list">
      <button *ngFor="let person of people" class="person-result" type="button" (click)="openPerson(person)">
        <img [src]="person.profile_path ? 'https://image.tmdb.org/t/p/w185' + person.profile_path : '/assets/placeholder-profile.png'" [alt]="person.name">
        <span class="person-result-info">
          <strong>{{ person.name }}</strong>
          <small *ngIf="person.known_for.length">
            {{ person.known_for[0].title || person.known_for[0].name }}
            <ng-container *ngIf="person.known_for[1]"> · {{ person.known_for[1].title || person.known_for[1].name }}</ng-container>
          </small>
          <span class="profile-link">Voir le profil et ses films →</span>
        </span>
      </button>
    </div>
  </section>
  <div class="movie-list-body">
    <app-movie
      *ngFor="let movie of movies"
      [title]="movie.title"
      [posterPath]="movie.poster_path"
      (select)="onSelect(movie)"
    ></app-movie>
    <app-movie
      *ngFor="let show of tvShows"
      [title]="show.name"
      [posterPath]="show.poster_path || ''"
      (select)="selectTvShow(show)"
    ></app-movie>
    
    <!-- API/configuration error message -->
    <div *ngIf="loadError && !isLoading" class="no-movies-message" role="alert">
      <div class="no-movies-content">
        <i class="no-movies-icon">⚠️</i>
        <h3>Erreur de chargement</h3>
        <p>{{ loadError }}</p>
      </div>
    </div>

    <!-- No movies found message -->
    <div *ngIf="movies.length === 0 && tvShows.length === 0 && !isLoading && !loadError" class="no-movies-message">
      <div class="no-movies-content">
        <i class="no-movies-icon">🎬</i>
        <h3>No movies found</h3>
        <p>Try adjusting your search criteria or browse our popular movies.</p>
      </div>
    </div>
    
    <!-- Loading message -->
    <div *ngIf="isLoading" class="loading-message" [class.loading-more]="movies.length > 0 || tvShows.length > 0">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p>Chargement des contenus...</p>
      </div>
    </div>

    <div #scrollSentinel class="scroll-sentinel" aria-hidden="true"></div>
  </div>

  <app-movie-detail-overlay
    *ngIf="selectedMovie"
    [movie]="selectedMovie"
    (close)="closeMovie()"
    (selectActor)="openActor($event)"
  ></app-movie-detail-overlay>

  <app-person-detail-overlay
    *ngIf="selectedPersonId"
    [personId]="selectedPersonId"
    (close)="closeActor()"
    (selectMovie)="openMovieFromActor($event)"
    (selectTvShow)="openTvShowFromActor($event)"
  ></app-person-detail-overlay>

  <app-tv-detail-overlay
    *ngIf="selectedTvShow"
    [show]="selectedTvShow"
    [seasonNumber]="selectedSeasonNumber"
    (close)="closeTvShow()"
    (selectActor)="openActorFromTv($event)"
    (selectSeason)="openTvSeason($event)"
    (closeSeasonDetails)="closeTvSeason()"
  ></app-tv-detail-overlay>
</div>
