<div class="container">
  <!-- Search Bar -->
  <div class="row justify-content-center">
    <div class="col-auto">
      <div class="input-group mb-3 search-bar">
        <div class="search-input-wrapper">
          <input
            #searchInput
            type="text"
            class="form-control custom-input"
            placeholder="Search..."
            [ngModel]="searchText"
            (ngModelChange)="onSearchTextChange($event)"
            name="searchText"
            (keydown)="onKeyDown($event, searchInput)"
            (focus)="onInputFocus()"
            (blur)="onInputBlur()"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="search-suggestions"
            [attr.aria-expanded]="suggestionsOpen"
            [attr.aria-activedescendant]="activeSuggestionIndex >= 0 ? 'search-suggestion-' + activeSuggestionIndex : null"
            inputmode="search"
            enterkeyhint="search"
            autocomplete="off"
          />
          <div *ngIf="mediaType === 'movie' && suggestionsOpen" id="search-suggestions" class="suggestions" role="listbox">
            <p *ngIf="suggestionsLoading && !suggestions.length" class="suggestions-status">Recherche…</p>
            <button
              *ngFor="let suggestion of suggestions; let index = index"
              [id]="'search-suggestion-' + index"
              class="suggestion"
              [class.active]="index === activeSuggestionIndex"
              type="button"
              role="option"
              [attr.aria-selected]="index === activeSuggestionIndex"
              (mousedown)="$event.preventDefault()"
              (click)="chooseSuggestion(suggestion, searchInput)"
            >
              <img [src]="suggestionImage(suggestion)" [alt]="suggestionTitle(suggestion)">
              <span class="suggestion-copy">
                <strong>{{ suggestionTitle(suggestion) }}</strong>
                <small>{{ suggestion.type === 'movie' ? 'Film' : 'Acteur' }} · {{ suggestionSubtitle(suggestion) }}</small>
              </span>
            </button>
          </div>
        </div>

        <div class="button-group">
          <button class="search-btn" type="button" (click)="onSearch(searchInput)">
            Search
          </button>

          <button class="filter-btn" type="button" (click)="toggleFilters()">
            <i class="bi bi-funnel"></i>
            {{ isFirstClick ? 'Filters +' : 'Filters –' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center" *ngIf="!isFirstClick" id="filters">
    <div class="col-auto all_filters">
      <select
        id="genre"
        class="form-select custom-select"
        [(ngModel)]="selectedGenre"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">All genres</option>
        <option *ngFor="let genre of genres" [value]="genre.id">
          {{ genre.name }}
        </option>
      </select>

      <select
        id="countrySelect"
        class="form-select custom-select"
        [(ngModel)]="selectedCountry"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">All countries</option>
        <option *ngFor="let country of countries" [value]="country.code">
          {{ country.name }}
        </option>
      </select>

      <select
        id="yearSelect"
        class="form-select custom-select"
        [(ngModel)]="selectedYear"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">All years</option>
        <option *ngFor="let year of years" [value]="year">
          {{ year }}
        </option>
      </select>

      <select
        name="alphabetic"
        id="alphabeticSelect"
        class="form-select custom-select"
        [(ngModel)]="selectedAlphabetic"
        (ngModelChange)="onFilterChange()"
      >
        <option value="popularity.desc">Default</option>
        <option value="title.asc">A → Z</option>
        <option value="title.desc">Z → A</option>
      </select>
    </div>
  </div>
</div>
